{% extends "base.html" %}

{% block title %}{{ section }}{% endblock %}

{% block content %}
<section class="card coming-soon">
  <h1>{{ section }}</h1>
  <p>Раздел в разработке — появится в Фазе {{ phase }}.</p>
  {% if user.is_staff %}
    <p class="muted">
      Пока данные можно смотреть и редактировать в
      <a href="{% url 'admin:index' %}">админке</a>.
    </p>
  {% endif %}
</section>
{% endblock %}
